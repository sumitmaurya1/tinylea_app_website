name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      # Fail loudly rather than shipping a half-built site.
      - name: Verify the export
        run: |
          for f in index.html robots.txt sitemap.xml llms.txt opengraph-image.png .htaccess; do
            test -s "out/$f" || { echo "missing or empty: out/$f"; exit 1; }
          done
          echo "pages: $(find out -name index.html | wc -l)"

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ./public_html/
          # Keeps anything you manage by hand on the server.
          exclude: |
            **/.git*
            **/.git*/**
