name: CI

# Hostinger builds and deploys from Git directly, so this only guards the
# branch: if the build or types break, the push goes red before Hostinger
# tries to deploy it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify the export
        run: |
          for f in index.html robots.txt sitemap.xml llms.txt opengraph-image.png .htaccess; do
            test -s "out/$f" || { echo "missing or empty: out/$f"; exit 1; }
          done
          echo "pages: $(find out -name index.html | wc -l)"
